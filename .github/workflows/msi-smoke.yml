# Fork-only: build the Windows MSIs the way draft.yml's build-windows job does
# (`cargo xtask dist`), then install each on a matching Windows runner.
name: msi-smoke

on:
  push:
    branches: [winget-wix-smoke]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      YAZI_GEN_COMPLETIONS: true
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link.exe
      CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER: lld-link.exe
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build (cargo xtask dist now also makes the MSI)
        run: cargo xtask dist --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-msi
          path: yazi-${{ matrix.target }}.msi
          if-no-files-found: error

  install-test:
    needs: build-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            machine: 0x8664
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            machine: 0xAA64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.target }}-msi
      - name: Install, check, and uninstall the MSI
        shell: pwsh
        run: |
          $msi = (Get-ChildItem *.msi | Select-Object -First 1).FullName
          "msi: $msi"
          function Invoke-Msi($verb, $log) {
            $p = Start-Process msiexec -ArgumentList "$verb `"$msi`" /qn /l*v $log" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "msiexec $verb failed: $($p.ExitCode)" }
          }
          Invoke-Msi '/i' install.log
          $bin = Join-Path $env:ProgramFiles 'yazi\bin'
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          if ($machinePath -notlike '*\yazi\bin*') { throw 'yazi\bin is not on the machine PATH' }
          $env:Path = $machinePath   # what a new session, SSH included, gets
          foreach ($name in 'yazi', 'ya') {
            $exe = Join-Path $bin "$name.exe"
            if (-not (Test-Path $exe)) { throw "not installed at $exe" }
            if ((Get-Item $exe).LinkType) { throw "$name.exe is a link, not a file" }
            $bytes = [IO.File]::ReadAllBytes($exe)
            $machine = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3C) + 4)
            "${name}: PE machine 0x{0:X4}, $((Get-Command $name).Source)" -f $machine
            if ($machine -ne ${{ matrix.machine }}) { throw "unexpected PE machine type for $name" }
            & $name --version
            if ($LASTEXITCODE -ne 0) { throw "$name --version failed" }
          }
          if (-not (Get-Service sshd -ErrorAction SilentlyContinue)) { Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Null }
          Start-Service sshd
          $key = Join-Path $env:TEMP 'smoke_ed25519'
          cmd /c ('ssh-keygen -q -t ed25519 -N "" -f "{0}"' -f $key)
          $auth = 'C:\ProgramData\ssh\administrators_authorized_keys'
          Get-Content "$key.pub" | Set-Content $auth -Encoding ascii
          icacls $auth /inheritance:r /grant 'Administrators:F' /grant 'SYSTEM:F' | Out-Null
          ssh -i $key -o StrictHostKeyChecking=no -o BatchMode=yes "$env:USERNAME@localhost" 'yazi --version && ya --version'
          if ($LASTEXITCODE -ne 0) { throw 'yazi/ya failed over SSH after the MSI install' }
          Invoke-Msi '/x' uninstall.log
          if (Test-Path (Join-Path $bin 'yazi.exe')) { throw 'yazi.exe remains after uninstall' }
          if ([Environment]::GetEnvironmentVariable('Path', 'Machine') -like '*\yazi\bin*') { throw 'PATH entry remains after uninstall' }
          'install, PATH lookup, SSH, and uninstall OK'
